<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1 class="title">Focus on<span> Today</span></h1>
      <div class="app-container">
        <h2 class="subtitle">
          Today <img class="sun-icon" src="./images/Sun.svg" alt="sun" />
        </h2>
        <p class="progress-level">Raise the bar by completing your goals!</p>

        <div class="progress-bar">
          <div class="progress-value">
            <p>
              <span id="completed-task-number">0</span>/<span id="total-goals"
                >3</span
              >
              Completed
            </p>
          </div>

          <p class="error-label">Please set all the 3 goals!</p>
        </div>

        <div class="all-goals-container">
          <div class="goal-container">
            <div class="custom-checkbox">
              <img
                class="check-icon"
                src="./images/Vector 1.svg"
                alt="check-icon"
              />
            </div>
            <input
              id="goal1"
              type="text"
              class="goal-input"
              placeholder="Add new goal..."
              autocomplete="off"
            />
          </div>

          <div class="goal-container">
            <div class="custom-checkbox">
              <img
                class="check-icon"
                src="./images/Vector 1.svg"
                alt="check-icon"
              />
            </div>
            <input
              id="goal2"
              type="text"
              class="goal-input"
              placeholder="Add new goal..."
              autocomplete="off"
            />
          </div>

          <div class="goal-container">
            <div class="custom-checkbox">
              <img
                class="check-icon"
                src="./images/Vector 1.svg"
                alt="check-icon"
              />
            </div>
            <input
              id="goal3"
              type="text"
              class="goal-input"
              placeholder="Add new goal..."
              autocomplete="off"
            />
          </div>
        </div>

        <div class="add-goal">
          <button>Add Goal</button>
        </div>

        <p class="quote">“Move one step ahead, today!”</p>
        <p class="made-with">Made by Akash</p>
      </div>
    </main>
  </body>
</html>
